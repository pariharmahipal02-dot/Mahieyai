<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Remove AI - Free AI Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar -->
    <nav class="sticky top-0 w-full z-40 glass px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="text-2xl font-extrabold flex items-center gap-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 cursor-pointer">
            <img src="7335_2.webp" alt="Logo" class="h-8 w-auto object-contain">
            BG Remove
        </div>
        <div class="flex items-center gap-3" id="navAuthArea">
            <!-- CONTEST BUTTON (Link to refer.html) -->
            <a href="refer.html" class="hidden md:flex bg-gradient-to-r from-yellow-400 to-orange-500 text-black px-4 py-2 rounded-full font-bold text-sm hover:scale-105 transition shadow-sm">
                <i class="fas fa-trophy mr-1"></i> Contest
            </a>
            <button onclick="window.showAuthModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full font-bold transition text-sm shadow-md">
                Login
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="pt-24 pb-10 px-4 max-w-5xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-8 tracking-tight">AI-Powered <span class="text-blue-600">Photo Studio</span></h1>
        
        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6 md:p-8">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Upload Box -->
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 flex flex-col items-center justify-center hover:border-blue-500 cursor-pointer bg-gray-50 h-[300px]">
                    <input type="file" id="imageInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*">
                    <i class="fas fa-cloud-upload-alt text-5xl text-blue-500 mb-4"></i>
                    <h3 class="font-semibold text-gray-700">Upload Image</h3>
                </div>
                <!-- Preview Box -->
                <div class="bg-gray-100 rounded-xl flex items-center justify-center h-[300px] overflow-hidden">
                    <img id="imagePreview" class="hidden max-h-full max-w-full object-contain" src="" alt="Preview">
                    <div id="previewText" class="text-gray-400"><p>Result Preview</p></div>
                </div>
            </div>
            <button id="removeBgBtn" class="mt-8 bg-blue-600 text-white px-10 py-3 rounded-xl font-bold w-full md:w-auto hover:bg-blue-700 transition">Remove Background</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="hidden fixed inset-0 z-[200] bg-gray-900/60 backdrop-blur-sm flex justify-center items-center p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl relative">
            <button onclick="window.hideAuthModal()" class="absolute top-4 right-5 text-2xl text-gray-400">&times;</button>
            <h2 class="text-2xl font-bold mb-6 text-center">Login to Access</h2>
            <button onclick="window.loginWithGoogle()" class="w-full bg-white border border-gray-300 py-3 rounded-xl font-bold shadow-sm flex justify-center items-center gap-3">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6"> Continue with Google
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIG (Check this carefully!)
        const firebaseConfig = {
          apiKey: "AIzaSyDSFwn1log1-ehfYwLudOAPVWzGfsp86Bg",
          authDomain: "mahieyai.firebaseapp.com",
          projectId: "mahieyai",
          storageBucket: "mahieyai.firebasestorage.app",
          messagingSenderId: "618821654527",
          appId: "1:618821654527:web:21b27ff53fb6a923d839ca"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Referral tracking logic
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get('ref');
        if (refId) sessionStorage.setItem('referredBy', refId);

        window.showAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
        window.hideAuthModal = () => document.getElementById('authModal').classList.add('hidden');
        window.loginWithGoogle = async () => await signInWithPopup(auth, googleProvider);
        window.logoutUser = async () => await signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            const nav = document.getElementById('navAuthArea');
            if (user) {
                // New user logic (Referral registration)
                const userDocRef = doc(db, "users", user.uid);
                const snap = await getDoc(userDocRef);
                if(!snap.exists()) {
                    const referredBy = sessionStorage.getItem('referredBy');
                    await setDoc(userDocRef, { name: user.displayName, referrals: 0 });
                    if(referredBy && referredBy !== user.uid) {
                        await updateDoc(doc(db, "users", referredBy), { referrals: increment(1) });
                    }
                }
                nav.innerHTML = `
                    <a href="refer.html" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black px-4 py-2 rounded-full font-bold text-sm">Contest</a>
                    <button onclick="window.logoutUser()" class="text-gray-500 hover:text-red-500 ml-2"><i class="fas fa-sign-out-alt"></i></button>
                `;
            }
        });

        // Basic Tool Logic (Keep existing functionality)
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('imagePreview').src = event.target.result;
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('previewText').classList.add('hidden');
            };
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
